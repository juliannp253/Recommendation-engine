<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Sign In - WatchWise</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="auth-shell">

    <!-- Left: brand / visual panel (decorative, hidden on small screens) -->
    <aside class="auth-visual" aria-hidden="true">
        <div class="mosaic">
            <div class="mosaic-tile accent"></div>
            <div class="mosaic-tile"></div>
            <div class="mosaic-tile accent"></div>
            <div class="mosaic-tile"></div>
            <div class="mosaic-tile accent"></div>
            <div class="mosaic-tile"></div>
            <div class="mosaic-tile"></div>
            <div class="mosaic-tile accent"></div>
            <div class="mosaic-tile"></div>
        </div>

        <div class="auth-brand">
                <span class="brand-mark">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M6 4l14 8-14 8V4z"/></svg>
                </span>
            <span class="brand-word">Watch<span class="brand-accent">Wise</span></span>
        </div>

        <p class="auth-tagline">Movies, matched to your taste — not just what's trending.</p>

        <div class="auth-ticker">
            <span>Because you loved <em>Inception</em></span>
            <span><em>96% match</em> for your evening</span>
            <span>Curated from thousands of titles</span>
            <span>Your next favorite, one click away</span>
        </div>
    </aside>

    <!-- Right: sign in form -->
    <main class="auth-main">

        <div class="auth-brand auth-brand--mobile">
                <span class="brand-mark">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M6 4l14 8-14 8V4z"/></svg>
                </span>
            <span class="brand-word">Watch<span class="brand-accent">Wise</span></span>
        </div>

        <form method="POST" th:action="@{/login}" class="auth-form">
            <h2>Sign In</h2>
            <p class="auth-subtitle">Pick up right where you left off.</p>

            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="username" required autocomplete="username" placeholder="you@example.com">
            </div>

            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
            </div>

            <button type="submit" class="watch-btn">Sign In</button>

            <p class="auth-switch">New to WatchWise? <a th:href="@{/register}">Create an account</a></p>
        </form>

    </main>

</div>

</body>

</html>
