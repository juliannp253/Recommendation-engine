<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home - Movie App</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header class="hero-section" id="hero-container"
        th:style="'background-image: linear-gradient(to bottom, rgba(0,0,0,0.3), #0d0d0d), url(' + @{/images/placeholder_bg.jpg} + ');'">

    <img id="hero-poster" th:src="@{/images/placeholder.png}" alt="Featured Movie" class="hero-poster" style="transition: opacity 0.5s ease-in-out;" />

    <div class="hero-info">
        <h1 id="hero-title" class="movie-title">Generating Recommendations...</h1>

        <p id="hero-desc" class="movie-synopsis">
            We are analyzing your taste to find the best movies for you.
        </p>

        <a id="hero-btn" href="#" class="watch-btn">View Details</a>
    </div>
</header>

<nav class="top-navbar">
    <ul>
        <li><a th:href="@{/home}">Home</a></li>
        <li><a href="#">Filter</a></li>
        <li><a th:href="@{/search}">Search</a></li>
        <li><a th:href="@{/profile}">Profile</a></li>
        <li>
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit" class="logout-button">Logout</button>
            </form>
        </li>
    </ul>
</nav>

<main>
    <div th:if="${trendingMoviesList != null and !trendingMoviesList.isEmpty()}">
        <section class="movie-category">
            <h2>Top Trending</h2>
            <div class="carousel">
                <div th:each="movie : ${trendingMoviesList}" class="movie-card">
                    <a th:href="@{'/movie/' + ${movie.title}}" th:if="${movie.poster != null}" style="width: 100%; height: 100%; display: block;">
                        <img th:src="${movie.poster}" th:alt="${movie.title}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 8px;">
                    </a>
                    <div th:if="${movie.poster == null}" th:text="${movie.title}"></div>
                </div>
            </div>
        </section>
    </div>

    <div th:if="${recommendationSections != null}" th:each="section : ${recommendationSections}">
        <section class="movie-category">
            <h2 th:text="${section.title}">Section Title</h2>

            <div class="carousel">
                <div th:each="movie : ${section.movies}" class="movie-card" th:title="${movie.aiReason}">

                    <a th:href="@{'/movie/' + ${movie.title}}" th:if="${movie.posterPath != null}" style="width: 100%; height: 100%; display: block;">
                        <img th:src="${movie.posterPath}" th:alt="${movie.title}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 8px;" />
                    </a>

                    <div th:if="${movie.posterPath == null}" th:text="${movie.title}" style="color: white; padding: 10px;"></div>
                </div>
            </div>
        </section>
    </div>

    <section class="movie-category" th:if="${recommendationSections == null or recommendationSections.isEmpty()}">
        <p style="color: white; text-align: center;">Generating your personalized recommendations...</p>
    </section>
</main>

<script th:inline="javascript">
    /*<![CDATA[*/

    var recommendationSections = /*[[${recommendationSections}]]*/ null;
    var trendingMovies = /*[[${trendingMoviesList}]]*/ null;

    var heroMovies = [];


    if (recommendationSections && recommendationSections.length > 0) {
        heroMovies = recommendationSections[0].movies;
    }

    else if (trendingMovies && trendingMovies.length > 0) {
        heroMovies = trendingMovies.map(m => ({
            id: m.ImdbID || m.id,
            title: m.title,
            posterPath: m.poster,
            aiReason: m.plot || "Trending worldwide right now."
        }));
    }

    if (heroMovies.length > 0) {
        let currentIndex = 0;

        const posterEl = document.getElementById('hero-poster');
        const titleEl = document.getElementById('hero-title');
        const descEl = document.getElementById('hero-desc');
        const btnEl = document.getElementById('hero-btn');
        const containerEl = document.getElementById('hero-container');

        function updateHero() {
            const movie = heroMovies[currentIndex];

            posterEl.style.opacity = 0;

            setTimeout(() => {
                posterEl.src = movie.posterPath;
                titleEl.textContent = movie.title;
                descEl.textContent = movie.aiReason ? '"' + movie.aiReason + '"' : "Recommended for you.";
                btnEl.href = '/movie/' + movie.id;

                posterEl.style.opacity = 1;
            }, 500);

            currentIndex = (currentIndex + 1) % heroMovies.length;
        }

        updateHero();
        setInterval(updateHero, 7500);
    }
    /*]]>*/
</script>

</body>
</html>
