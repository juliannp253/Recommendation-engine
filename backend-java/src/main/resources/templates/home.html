<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home - Movie App</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
<!-- Header: Poster + Synopsis -->
<header class="hero-section">
    <img th:src="@{/images/placeholder.png}" alt="Featured Movie" class="hero-poster">
    <div class="hero-info">
        <h1 class="movie-title">Movie Title</h1>
        <p class="movie-synopsis">
            This is a brief synopsis of the featured movie. Lorem ipsum dolor sit amet, consectetur adipiscing elit.
        </p>
        <button class="watch-btn">Watch Now</button>
    </div>
</header>

<!-- Navbar -->
<nav class="top-navbar">
    <ul>
        <li><a th:href="@{/home}">Home</a></li>
        <li><a href="#">Filter</a></li>
        <li><a th:href="@{/search}">Search</a></li>
        <li><a href="#">Categories</a></li>
        <li>
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit" class="logout-button">
                    Logout
                </button>
            </form>
        </li>
    </ul>
</nav>

<!-- Categories -->
<main>
    <div th:if="${trendingMoviesList != null and !trendingMoviesList.isEmpty()}">
        <section class="movie-category">
            <h2>Top Trending</h2>
            <div class="carousel">
                <div th:each="movie : ${trendingMoviesList}" class="movie-card">
                    <a th:href="@{'/movie/' + ${movie.ImdbID}}" th:if="${movie.poster != null}" style="width: 100%; height: 100%; display: block;">
                        <img th:src="${movie.poster}" th:alt="${movie.title}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 8px;">
                    </a>
                    <div th:if="${movie.poster == null}" th:text="${movie.title}"></div>
                </div>
            </div>
        </section>
    </div>

    <!-- Dynamic Genre Sections - Fixed property access -->
    <div th:if="${genreMoviesList != null}" th:each="genreMovies : ${genreMoviesList}">
        <section class="movie-category">
            <h2 th:text="${genreMovies.genreName}">Test Genre Section</h2>
            <div class="carousel">
                <div th:each="movie : ${genreMovies.movies}" class="movie-card">
                    <a th:href="@{'/movie/' + ${movie.id}}" th:if="${movie.posterUrl != null and movie.posterUrl != 'N/A'}" style="width: 100%; height: 100%; display: block;">
                        <img th:src="${movie.posterUrl}" th:alt="${movie.title}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 8px;">
                    </a>
                    <div th:if="${movie.posterUrl == null or movie.posterUrl == 'N/A'}" th:text="${movie.title}"></div>
                </div>
            </div>
        </section>
    </div>

    <!-- Fallback section if no genre movies available -->
    <section class="movie-category" th:if="${genreMoviesList == null or genreMoviesList.isEmpty()}">
        <h2>Movies</h2>
        <div class="carousel">
            <div th:each="movie : ${sciFiMovies}" class="movie-card">
                <a th:href="@{'/movie/' + ${movie.imdbID}}" th:if="${movie.poster != null and movie.poster != 'N/A'}" style="width: 100%; height: 100%; display: block;">
                    <img th:src="${movie.poster}" th:alt="${movie.title}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 8px;">
                </a>
                <div th:if="${movie.poster == null or movie.poster == 'N/A'}" th:text="${movie.title}"></div>
            </div>
        </div>
    </section>
</main>
</body>
</html>
