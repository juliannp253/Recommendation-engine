<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home - Movie App</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
<!-- Header: Poster + Synopsis -->
<header class="hero-section">
    <img th:src="@{/images/placeholder.png}" alt="Featured Movie" class="hero-poster">
    <div class="hero-info">
        <h1 class="movie-title">Movie Title</h1>
        <p class="movie-synopsis">
            This is a brief synopsis of the featured movie. Lorem ipsum dolor sit amet, consectetur adipiscing elit.
        </p>
        <button class="watch-btn">Watch Now</button>
    </div>
</header>

<!-- Navbar -->
<nav class="top-navbar">
    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Filter</a></li>
        <li><a href="#">Search</a></li>
        <li><a href="#">Categories</a></li>
    </ul>
</nav>

<!-- Categories -->
<main>
    <section class="movie-category">
        <h2>Recommended</h2>
        <div class="carousel">
            <div class="movie-card">Movie 1</div>
            <div class="movie-card">Movie 2</div>
            <div class="movie-card">Movie 3</div>
            <div class="movie-card">Movie 4</div>
        </div>
    </section>

    <section class="movie-category">
        <h2>Sci-fi</h2>
        <div class="carousel">
            <div class="movie-card">Movie A</div>
            <div class="movie-card">Movie B</div>
            <div class="movie-card">Movie C</div>
            <div class="movie-card">Movie D</div>
        </div>
    </section>
</main>
</body>
</html>
