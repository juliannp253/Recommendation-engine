name: Deploy to AWS

on:
  workflow_run:
    workflows: ["CI — Build & Test"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    steps:
      - name: Deploy tested commit to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -eu
            deploy_sha='${{ github.event.workflow_run.head_sha }}'
            cd ~/Recommendation-engine
            git fetch origin main
            git cat-file -e "$deploy_sha^{commit}"
            git checkout --detach "$deploy_sha"
            test -z "$(git status --porcelain)"
            cd backend-java
            test -f ../.env
            docker compose config --quiet
            docker compose build app-cine

            # Migrate the container created by the previous docker run deployment.
            if docker container inspect movies-container >/dev/null 2>&1; then
              docker rm -f movies-container
            fi

            docker compose up -d --no-build --wait --wait-timeout 180
            for attempt in $(seq 1 30); do
              if curl --fail --silent --output /dev/null --max-time 5 http://127.0.0.1:8080/login; then
                echo "Login endpoint is ready at commit $deploy_sha"
                exit 0
              fi
              sleep 3
            done
            docker compose ps
            docker compose logs --tail=80 app-cine
            exit 1

      - name: Verify public login endpoint
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --output /dev/null --max-time 5 "http://${EC2_HOST}:8080/login"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
